[package]
name = "HydrantenFinder"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
windows = { version = "0.62.2", features = ["Devices_Geolocation", "Foundation"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_Foundation"] }
windows-future = "0.3.2"
geo = "0.33.1"
dotenvy = "0.15.7"
polyline = "0.11.0"
geo-types = "0.7.19"
anyhow = "1.0.104"
indicatif = "0.18.6"
image = "0.25.10"
minifb = "0.28.0"
rand = "0.10.2"
ansi_term = "0.12.1"
mysql = { version = "26.0.0", features = ["chrono"] }
geohash = "0.13.2"
chrono = { version = "0.4.45", features = ["serde"] }
ctrlc = "3.5.1"