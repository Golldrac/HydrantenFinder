[package]
name = "HydrantenFinder"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows = { version = "0.62.2", features = ["Devices_Geolocation", "Foundation"] }
windows-sys = { version = "0.52", features = ["Win32_System_Console", "Win32_Foundation"] }
windows-future = "0.3.2"
geo = "0.31.0"
dotenvy = "0.15"
polyline = "0.11.0"
geo-types = "0.7.17"
anyhow = "1.0"
indicatif = "0.18.3"
image = "0.25.9"
minifb = "0.25"
rand = "0.9.2"
ansi_term = "0.12.1"
mysql = "25.0.0"
geohash = "0.13.1"
chrono = "0.4"