[package]
name = "HydrantenFinder"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows = { version = "0.52.0", features = ["Devices_Geolocation", "Foundation", "deprecated"] }
geo = "0.27"
time = "0.3.44"